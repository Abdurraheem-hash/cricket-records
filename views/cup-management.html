<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Cup Management - Cricket Records</title>

<link
    rel="stylesheet"
    href="/css/style.css">


</head>

<body class="admin-dashboard-page">

<!-- ========================================= -->

<!-- HEADER -->

<!-- ========================================= -->

<header class="admin-dashboard-header">


<div>

    <h1>🏏 CRICKET RECORDS</h1>

    <p>Cup Management</p>

</div>


<a href="/admin-dashboard">

    <button
        class="admin-logout-button"
        style="background:#1976d2;">

        BACK

    </button>

</a>


</header>

<!-- ========================================= -->

<!-- MAIN -->

<!-- ========================================= -->

<main class="admin-dashboard-container">


<!-- ========================================= -->
<!-- WELCOME -->
<!-- ========================================= -->

<section class="admin-welcome">

    <h2>
        Cup Management
    </h2>

    <p>
        Create and manage your cricket cups.
    </p>

</section>



<!-- ========================================= -->
<!-- CREATE CUP -->
<!-- ========================================= -->

<section class="admin-dashboard-card">


    <h3>
        Create Cup
    </h3>



    <!-- CUP NAME -->

    <label for="cupName">

        <strong>
            Cup Name
        </strong>

    </label>

    <br><br>


    <input
        type="text"
        id="cupName"
        placeholder="Enter cup name"
        style="
            width:100%;
            max-width:500px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
            font-size:16px;
        ">



    <br><br>



    <!-- TEAM 1 SERIES WINS -->

    <label for="teamASeriesWins">

        <strong>
            Team 1 Series Wins
        </strong>

    </label>

    <br><br>


    <input
        type="number"
        id="teamASeriesWins"
        value="0"
        min="0"
        max="10"
        style="
            width:100%;
            max-width:500px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
            font-size:16px;
        ">



    <br><br>



    <!-- TEAM 2 SERIES WINS -->

    <label for="teamBSeriesWins">

        <strong>
            Team 2 Series Wins
        </strong>

    </label>

    <br><br>


    <input
        type="number"
        id="teamBSeriesWins"
        value="0"
        min="0"
        max="10"
        style="
            width:100%;
            max-width:500px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
            font-size:16px;
        ">



    <br><br>



    <!-- WINNER -->

    <label for="winner">

        <strong>
            Cup Winner
        </strong>

    </label>

    <br><br>


    <select
        id="winner"
        style="
            width:100%;
            max-width:500px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
            font-size:16px;
        ">

        <option value="">
            No Winner
        </option>

    </select>



    <br><br>



    <!-- COMPLETED -->

    <label>

        <input
            type="checkbox"
            id="completed">

        <strong>
            Cup Completed
        </strong>

    </label>



    <br><br>



    <!-- SAVE -->

    <button
        onclick="saveCup()">

        SAVE CUP

    </button>



    <!-- MESSAGE -->

    <p
        id="message"
        style="
            margin-top:15px;
            font-weight:bold;
        ">
    </p>


</section>



<!-- ========================================= -->
<!-- EXISTING CUPS -->
<!-- ========================================= -->

<section
    class="admin-dashboard-card"
    style="margin-top:20px;">


    <h3>
        Existing Cups
    </h3>


    <div id="cupsList">

        <p>
            Loading cups...
        </p>

    </div>


</section>



<!-- ========================================= -->
<!-- BACK -->
<!-- ========================================= -->

<div class="admin-back-section">

    <a href="/admin-dashboard">

        ← Back to Admin Dashboard

    </a>

</div>


</main>

<script>


// =================================================
// VARIABLES
// =================================================

let teams = [];



// =================================================
// LOAD TEAMS
// =================================================

async function loadTeams() {

    try {

        const response =
            await fetch("/api/teams");


        if (!response.ok) {

            throw new Error(
                "Unable to load teams"
            );

        }


        teams =
            await response.json();


        const winnerSelect =
            document.getElementById(
                "winner"
            );


        winnerSelect.innerHTML = `
            <option value="">
                No Winner
            </option>
        `;


        teams.forEach(team => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                team.team_name;


            option.textContent =
                team.team_name;


            winnerSelect.appendChild(
                option
            );

        });


        // Update labels

        if (teams.length >= 2) {

            document.querySelector(
                'label[for="teamASeriesWins"]'
            ).innerHTML =
                `<strong>${teams[0].team_name} Series Wins</strong>`;


            document.querySelector(
                'label[for="teamBSeriesWins"]'
            ).innerHTML =
                `<strong>${teams[1].team_name} Series Wins</strong>`;

        }


    } catch (error) {

        console.error(error);

        document.getElementById(
            "message"
        ).textContent =
            "Unable to load team names.";

    }

}



// =================================================
// LOAD CUPS
// =================================================

async function loadCups() {

    const cupsList =
        document.getElementById(
            "cupsList"
        );


    try {

        const response =
            await fetch("/api/cups");


        if (!response.ok) {

            throw new Error(
                "Unable to load cups"
            );

        }


        const cups =
            await response.json();


        if (cups.length === 0) {

            cupsList.innerHTML = `
                <p>
                    No cups created yet.
                </p>
            `;

            return;

        }


        cupsList.innerHTML = "";


        cups.forEach(cup => {

            const div =
                document.createElement(
                    "div"
                );


            div.style.cssText = `
                border:1px solid #ddd;
                border-radius:8px;
                padding:15px;
                margin-top:10px;
            `;


            const winnerText =
                cup.winner
                    ? cup.winner
                    : "Not decided";


            const statusText =
                cup.completed
                    ? "Completed"
                    : "In Progress";


            div.innerHTML = `

                <h4>
                    Cup ${cup.cup_number} -
                    ${cup.cup_name}
                </h4>

                <p>
                    ${teams.length >= 2
                        ? teams[0].team_name
                        : "Team 1"}
                    Series Wins:
                    <strong>
                        ${cup.team_a_series_wins}
                    </strong>
                </p>

                <p>
                    ${teams.length >= 2
                        ? teams[1].team_name
                        : "Team 2"}
                    Series Wins:
                    <strong>
                        ${cup.team_b_series_wins}
                    </strong>
                </p>

                <p>
                    Winner:
                    <strong>
                        ${winnerText}
                    </strong>
                </p>

                <p>
                    Status:
                    <strong>
                        ${statusText}
                    </strong>
                </p>

                <button
                    onclick="deleteCup(${cup.id})"
                    style="
                        background:#d32f2f;
                        margin-top:5px;
                    ">

                    DELETE

                </button>

            `;


            cupsList.appendChild(
                div
            );

        });


    } catch (error) {

        console.error(error);

        cupsList.innerHTML = `
            <p>
                Unable to load cups.
            </p>
        `;

    }

}



// =================================================
// SAVE CUP
// =================================================

async function saveCup() {

    const cupName =
        document.getElementById(
            "cupName"
        ).value.trim();


    const teamASeriesWins =
        Number(
            document.getElementById(
                "teamASeriesWins"
            ).value
        );


    const teamBSeriesWins =
        Number(
            document.getElementById(
                "teamBSeriesWins"
            ).value
        );


    const winner =
        document.getElementById(
            "winner"
        ).value;


    const completed =
        document.getElementById(
            "completed"
        ).checked;


    const message =
        document.getElementById(
            "message"
        );


    // VALIDATION

    if (!cupName) {

        message.textContent =
            "Please enter a cup name.";

        return;

    }


    if (
        teamASeriesWins < 0 ||
        teamBSeriesWins < 0
    ) {

        message.textContent =
            "Series wins cannot be negative.";

        return;

    }


    if (
        teamASeriesWins > 10 ||
        teamBSeriesWins > 10
    ) {

        message.textContent =
            "Series wins cannot be more than 10.";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/cups",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        cup_name:
                            cupName,

                        team_a_series_wins:
                            teamASeriesWins,

                        team_b_series_wins:
                            teamBSeriesWins,

                        winner:
                            winner ||
                            null,

                        completed:
                            completed

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            message.textContent =
                data.error ||
                "Failed to create cup.";

            return;

        }


        message.textContent =
            "Cup created successfully!";


        // Clear form

        document.getElementById(
            "cupName"
        ).value = "";


        document.getElementById(
            "teamASeriesWins"
        ).value = 0;


        document.getElementById(
            "teamBSeriesWins"
        ).value = 0;


        document.getElementById(
            "winner"
        ).value = "";


        document.getElementById(
            "completed"
        ).checked = false;


        // Reload cups

        loadCups();


    } catch (error) {

        console.error(error);

        message.textContent =
            "Something went wrong while creating the cup.";

    }

}



// =================================================
// DELETE CUP
// =================================================

async function deleteCup(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this cup?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/cups/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Failed to delete cup."
            );

            return;

        }


        alert(
            "Cup deleted successfully!"
        );


        loadCups();


    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong while deleting the cup."
        );

    }

}



// =================================================
// START
// =================================================

loadTeams();

loadCups();


</script>

</body>

</html>
